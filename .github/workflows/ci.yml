name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore FoodDelivery.sln

      - name: Build
        run: dotnet build FoodDelivery.sln --no-restore -c Release

      - name: Test
        run: dotnet test FoodDelivery.sln --no-build -c Release --verbosity normal
